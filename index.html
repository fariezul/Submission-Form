<!DOCTYPE html>
<!--
  index.html — the STRUCTURE of the page.
  Think of HTML as the skeleton: it says what things exist.
  CSS (style.css) makes it look good, JS (app.js) makes it work.
-->
<html lang="en">
<head>
  <!-- Tells the browser which character set to use (supports accents, symbols) -->
  <meta charset="UTF-8" />

  <!-- Makes the page scale properly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Text shown in the browser tab -->
  <title>Student Registration | TVETMARA Masjid Tanah</title>

  <!-- Link to our stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ===== TOP BAR ================================================= -->
  <header class="site-header">
    <!--
      THE LOGO
      This is built from text + a small SVG shape rather than an image
      file, so it stays perfectly sharp at any screen size and there is
      no extra file to load.

      role="img" + aria-label tell screen readers to announce it as a
      single logo instead of reading the letters one at a time.
    -->
    <div class="brand" role="img" aria-label="TVETMARA Masjid Tanah">

      <!-- Top line: the TVETMARA wordmark -->
      <div class="wordmark">
        <span class="wm-letter">T</span>

        <!--
          The "V" in TVETMARA is drawn as a check mark.
          An SVG is a picture made of shapes described in code.
          Each <path> below is one stroke of the check:
            - the short red stroke on the left
            - the long blue stroke going up to the right
          "d" is the drawing instruction: M = move to, L = line to.
        -->
        <svg class="wm-check" viewBox="0 0 30 26" aria-hidden="true">
          <path class="wm-check-red"  d="M1 9 L9 26 L15 15 Z" />
          <path class="wm-check-blue" d="M9 26 L29 0 L21 0 L6 19 Z" />
        </svg>

        <span class="wm-letter">ETMARA</span>

        <!-- The small red square that finishes the logo -->
        <span class="wm-dot" aria-hidden="true"></span>
      </div>

      <!-- Bottom line: the campus name, widely spaced -->
      <div class="wordmark-sub">Masjid Tanah</div>

    </div>
  </header>

  <!-- ===== MAIN CONTENT ============================================ -->
  <main class="page">

    <!-- The "card" is the white box that holds the form -->
    <section class="card" aria-labelledby="form-title">

      <div class="card-header">
        <h1 id="form-title">Student Registration</h1>
        <p class="card-subtitle">
          Please provide your contact details. All fields are required.
        </p>
      </div>

      <!--
        SUCCESS MESSAGE
        It starts hidden (the "is-hidden" class). JavaScript removes
        that class after the data saves successfully.
      -->
      <div id="successMessage" class="alert alert-success is-hidden" role="status">
        <strong>Submission received.</strong>
        Thank you — your details have been recorded.
      </div>

      <!--
        ERROR MESSAGE
        Shown only if something goes wrong talking to Supabase.
        role="alert" tells screen readers to announce it.
      -->
      <div id="errorMessage" class="alert alert-error is-hidden" role="alert"></div>

      <!--
        THE FORM
        novalidate = "browser, don't show your own popup warnings" —
        we write our own validation in app.js so we can style it.
      -->
      <form id="contactForm" novalidate>

        <!-- ---------- Name field ---------- -->
        <div class="field">
          <!-- "for" must match the input's "id" so clicking the label focuses it -->
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Jane Smith"
            autocomplete="name"
          />
          <!-- Empty box where JavaScript will write an error, if any -->
          <p class="error-text" id="nameError"></p>
        </div>

        <!-- ---------- Email field ---------- -->
        <div class="field">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="jane.smith@company.com"
            autocomplete="email"
          />
          <p class="error-text" id="emailError"></p>
        </div>

        <!-- ---------- Phone field ---------- -->
        <div class="field">
          <label for="phone">Phone Number</label>
          <!--
            inputmode="numeric" makes phones show a number keypad.
            We still check the value in JavaScript, because a user
            could always paste letters in.
          -->
          <input
            type="tel"
            id="phone"
            name="phone"
            inputmode="numeric"
            placeholder="60123456789"
            autocomplete="tel"
          />
          <p class="hint">Digits only — no spaces, dashes or brackets.</p>
          <p class="error-text" id="phoneError"></p>
        </div>

        <!-- ---------- Submit button ---------- -->
        <button type="submit" class="btn-submit" id="submitButton">
          Submit Registration
        </button>

      </form>

      <p class="card-footer">
        Created by Farizul Jaafar
      </p>

    </section>
  </main>

  <!--
    SCRIPT
    app.js holds everything: the Supabase settings, the validation
    rules, and the code that saves the form. No build step, no
    server — this page is plain static files.
  -->
  <script src="app.js"></script>

</body>
</html>
